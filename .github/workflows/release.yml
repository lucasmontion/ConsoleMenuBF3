name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(jq -r .version manifest.json)
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match manifest version $VER"; exit 1
          fi

      - name: Build the extension zip
        run: |
          zip -r "console-style-menu-for-battlelog-${GITHUB_REF_NAME#v}.zip" \
            manifest.json background.js bridge.js menu.css page.css \
            README.md LICENSE PRIVACY.md CHANGELOG.md src icons

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: console-style-menu-for-battlelog-*.zip
          generate_release_notes: true